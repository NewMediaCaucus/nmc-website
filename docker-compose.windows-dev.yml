services:
  webserver:
    build: 
      context: .
      dockerfile: Dockerfile.windows-dev
    image: nmc-website-dev
    container_name: nmc-website-dev-container
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html/ # Mount the current directory to the container
      - ./custom-php.dev.ini:/usr/local/etc/php/conf.d/custom-php.ini
      - ./php-logs:/var/log/php-logs
      - ./apache-logs:/var/log/apache2
    # env_file:
    #   - ./id.env